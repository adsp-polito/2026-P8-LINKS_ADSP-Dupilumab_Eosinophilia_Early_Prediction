[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-eosinophilia-prediction"
version = "0.1.0"
description = "Early prediction of eosinophilia during dupilumab treatment"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]
